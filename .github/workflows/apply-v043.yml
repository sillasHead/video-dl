name: Apply v0.4.3

on:
  push:
    branches:
      - feat/batch-list
    paths:
      - '.github/scripts/apply_v043.py'
      - '.github/workflows/apply-v043.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/batch-list
      - name: Apply patch
        shell: pwsh
        run: python .github/scripts/apply_v043.py
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem src -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "Parser errors in $($_.Name):" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
            }
          }
          if ($failed) { exit 1 }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "src\video-dl.ps1" --version
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "src\video-dl.ps1" --help
      - name: Validate batch-list behavior
        shell: pwsh
        run: |
          $main = Get-Content src/video-dl.ps1 -Raw
          if ($main -notmatch '"--list"') { throw '--list parser missing.' }
          if ($main -notmatch 'Resolve-ListUrls') { throw 'Resolve-ListUrls missing.' }
          if ($main -notmatch 'Invoke-BatchSession') { throw 'Invoke-BatchSession missing.' }
          if ($main -notmatch 'AutoSequence') { throw 'Series auto-sequencing missing.' }

          $tmpList = Join-Path $env:RUNNER_TEMP 'empty-links.txt'
          @('# comment', '', '   ') | Set-Content -LiteralPath $tmpList -Encoding UTF8
          $output = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "src\video-dl.ps1" --list $tmpList 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0) { throw 'Empty TXT list should fail.' }
          if ($output -notmatch 'arquivo de lista') { throw 'Empty TXT error message missing.' }

          $output = & powershell.exe -NoProfile -ExecutionPolicy Bypass -File "src\video-dl.ps1" --list 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0) { throw '--list without values should fail.' }
          if ($output -notmatch 'pelo menos uma URL') { throw '--list missing-value error message missing.' }
          exit 0
      - name: Commit generated changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src README.md VERSION installer/video-dl.iss
          if (-not (git status --porcelain)) { exit 0 }
          git commit -m "feat: listas de links por TXT ou comando"
          git push origin HEAD:feat/batch-list
