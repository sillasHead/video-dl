name: Apply v0.4.2

on:
  push:
    branches:
      - feat/clean-names-internal-archive
    paths:
      - '.github/scripts/apply_v042.py'
      - '.github/workflows/apply-v042.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/clean-names-internal-archive
      - name: Apply patch
        shell: pwsh
        run: python .github/scripts/apply_v042.py
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem src -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "Parser errors in $($_.Name):" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
            }
          }
          if ($failed) { exit 1 }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "src\video-dl.ps1" --version
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "src\video-dl.ps1" --help
      - name: Validate clean naming rules
        shell: pwsh
        run: |
          $main = Get-Content src/video-dl.ps1 -Raw
          $pluto = Get-Content src/pluto-dl.ps1 -Raw
          if ($main -match 'Título original \[ID\]' -or $main -match '%\(title\).*\[%\(id\)s\]') { throw 'Visible ID naming remains in main script.' }
          if ($pluto -match '\$fileBase \+= " \[\$episodeId\]"') { throw 'Visible Pluto episode ID naming remains.' }
          if (-not (Test-Path src/archive.ps1)) { throw 'archive.ps1 missing.' }
      - name: Commit generated changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src setup.ps1 installer/video-dl.iss README.md VERSION
          if (-not (git status --porcelain)) { exit 0 }
          git commit -m "feat: nomes limpos com histórico interno"
          git push origin HEAD:feat/clean-names-internal-archive
