name: Fix v0.4.3 Pluto override

on:
  push:
    branches:
      - feat/batch-list
    paths:
      - '.github/scripts/fix_v043.py'
      - '.github/workflows/fix-v043.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/batch-list
      - name: Apply fix
        shell: pwsh
        run: python .github/scripts/fix_v043.py
      - name: Validate PowerShell
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path 'src/pluto-dl.ps1'), [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }; exit 1 }
          $text = Get-Content src/pluto-dl.ps1 -Raw
          if ($text -notmatch '(?s)if \(\$null -eq \$episode\).*?mEpisode') { throw 'Episode override guard missing.' }
      - name: Commit fix
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pluto-dl.ps1
          if (-not (git status --porcelain)) { exit 0 }
          git commit -m "fix: preserva episódio resolvido no lote Pluto"
          git push origin HEAD:feat/batch-list
