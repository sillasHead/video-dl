name: Apply v0.4.5 fix

on:
  push:
    branches:
      - fix/pluto-episode-api
    paths:
      - '.github/workflows/apply-v045-fix.yml'
      - 'src/episode-detection.ps1'
      - 'tests/episode-detection.ps1'
      - 'src/video-dl.ps1'
      - 'src/pluto-dl.ps1'
      - 'src/archive.ps1'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pluto-episode-api

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem src -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "Parser errors in $($_.Name):" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
            }
          }
          if ($failed) { exit 1 }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\episode-detection.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File src\video-dl.ps1 --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Test current Pluto persisted query
        shell: powershell
        run: |
          $variables = @{
            showId = '1550017'
            apiRawContentId = $null
            withApiRaw = $false
            episodeId = '626a9f2655812e0013e8412f'
          } | ConvertTo-Json -Compress
          $extensions = @{
            tnPersistedDocumentHash = 'c42c1d0736825cd1f43e28b71dfa6f4955a1b3003a92e42edf99fcae885ea1fe'
          } | ConvertTo-Json -Compress
          $uri = 'https://pluto.tv/api/tn/hubs/graphql/?operationName=FullEpisodesData&extensions=' + [uri]::EscapeDataString($extensions) + '&variables=' + [uri]::EscapeDataString($variables)
          try {
            $response = Invoke-RestMethod -Uri $uri -Method Get -TimeoutSec 30 -Headers @{
              'User-Agent'='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/122.0.0.0 Safari/537.36'
              'apollo-require-preflight'='true'
              'Accept'='application/json'
              'Referer'='https://pluto.tv/br/'
              'X-Forwarded-For'='177.47.27.205'
            }
            $json = $response | ConvertTo-Json -Depth 12 -Compress
            Write-Host "GraphQL response: $json"
          } catch {
            Write-Host "GRAPHQL ERROR: $($_.Exception.Message)"
            if ($null -ne $_.Exception.Response) { Write-Host "HTTP: $([int]$_.Exception.Response.StatusCode) $($_.Exception.Response.StatusDescription)" }
            throw
          }

      - name: Validate integration
        shell: pwsh
        run: |
          $main = Get-Content src/video-dl.ps1 -Raw
          $pluto = Get-Content src/pluto-dl.ps1 -Raw
          $archive = Get-Content src/archive.ps1 -Raw
          if ($main -match 'Get-VideoDlEpisodeNumbersFromText \$html') { throw 'Main still parses full HTML with generic title patterns.' }
          if ($pluto -match 'Get-VideoDlEpisodeNumbersFromText \$html') { throw 'Pluto helper still parses full HTML with generic title patterns.' }
          if ($archive -notmatch 'Try-ReconcileVideoDlSeriesPath') { throw 'Archive reconciliation missing.' }
          if ((Get-Content VERSION -Raw).Trim() -ne '0.4.5') { throw 'VERSION is not 0.4.5.' }
