name: Apply v0.4.5 fix

on:
  push:
    branches:
      - fix/pluto-episode-api
    paths:
      - '.github/workflows/apply-v045-fix.yml'
      - 'src/episode-detection.ps1'
      - 'tests/episode-detection.ps1'
      - 'src/video-dl.ps1'
      - 'src/pluto-dl.ps1'
      - 'src/archive.ps1'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pluto-episode-api

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem src -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "Parser errors in $($_.Name):" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
            }
          }
          if ($failed) { exit 1 }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\episode-detection.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File src\video-dl.ps1 --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Diagnose live Pluto VOD data
        shell: powershell
        run: |
          . .\src\episode-detection.ps1
          $url = 'https://pluto.tv/br/shows/1550017/episode/626a9f2655812e0013e8412f/'
          $showId = '1550017'
          $episodeId = '626a9f2655812e0013e8412f'
          try {
            $userAgent = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36'
            $headers = @{ 'User-Agent'=$userAgent; 'X-Forwarded-For'='177.47.27.205' }
            $params = @{
              appName='web'; appVersion='8.0.0-111b2b9dc00bd0bea9030b30662159ed9e7c8bc6';
              deviceVersion='122.0.0'; deviceModel='web'; deviceMake='chrome'; deviceType='web';
              clientID=[Guid]::NewGuid().ToString(); clientModelNumber='1.0.0'; serverSideAds='false';
              drmCapabilities='widevine:L3'; blockingMode=''; seriesIDs=$showId
            }
            $boot = Invoke-RestMethod -Uri 'https://boot.pluto.tv/v4/start' -Method Get -Body $params -TimeoutSec 20 -Headers $headers
            Write-Host "Boot props: $((@($boot.PSObject.Properties.Name) -join ', '))"
            Write-Host "Token present: $(-not [string]::IsNullOrWhiteSpace([string]$boot.sessionToken))"
            Write-Host "VOD count: $(@($boot.VOD).Count)"
            foreach ($vod in @($boot.VOD)) {
              Write-Host "VOD id=$($vod.id) name=$($vod.name) props=$((@($vod.PSObject.Properties.Name) -join ', '))"
              if ([string]$vod.id -ne $showId) { continue }
              Write-Host "Seasons count: $(@($vod.seasons).Count)"
              foreach ($season in @($vod.seasons)) {
                Write-Host "Season props: $((@($season.PSObject.Properties.Name) -join ', '))"
                foreach ($ep in @($season.episodes)) {
                  if ([string]$ep._id -eq $episodeId) {
                    Write-Host "MATCH props: $((@($ep.PSObject.Properties.Name) -join ', '))"
                    Write-Host "MATCH number=$($ep.number) season=$($ep.season) name=$($ep.name)"
                  }
                }
              }
            }
          } catch {
            Write-Host "BOOT/VOD ERROR: $($_.Exception.Message)"
            if ($null -ne $_.Exception.Response) { Write-Host "HTTP: $([int]$_.Exception.Response.StatusCode) $($_.Exception.Response.StatusDescription)" }
          }

          $api = Get-VideoDlPlutoEpisodeNumbers $url
          Write-Host "Current helper -> season=$($api.Season) episode=$($api.Episode) confidence=$($api.Confidence)"

      - name: Validate integration
        shell: pwsh
        run: |
          $main = Get-Content src/video-dl.ps1 -Raw
          $pluto = Get-Content src/pluto-dl.ps1 -Raw
          $archive = Get-Content src/archive.ps1 -Raw
          if ($main -match 'Get-VideoDlEpisodeNumbersFromText \$html') { throw 'Main still parses full HTML with generic title patterns.' }
          if ($pluto -match 'Get-VideoDlEpisodeNumbersFromText \$html') { throw 'Pluto helper still parses full HTML with generic title patterns.' }
          if ($archive -notmatch 'Try-ReconcileVideoDlSeriesPath') { throw 'Archive reconciliation missing.' }
          if ((Get-Content VERSION -Raw).Trim() -ne '0.4.5') { throw 'VERSION is not 0.4.5.' }
