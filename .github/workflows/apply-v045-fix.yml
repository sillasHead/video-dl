name: Apply v0.4.5 fix

on:
  push:
    branches:
      - fix/pluto-episode-api
    paths:
      - '.github/workflows/apply-v045-fix.yml'
      - 'src/episode-detection.ps1'
      - 'tests/episode-detection.ps1'
      - 'src/video-dl.ps1'
      - 'src/pluto-dl.ps1'
      - 'src/archive.ps1'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pluto-episode-api

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem src -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "Parser errors in $($_.Name):" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
            }
          }
          if ($failed) { exit 1 }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\episode-detection.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File src\video-dl.ps1 --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate live Pluto episode metadata
        shell: powershell
        run: |
          . .\src\episode-detection.ps1
          $cases = @(
            @{ Url='https://pluto.tv/br/shows/1550017/episode/626a9f2655812e0013e8412f/'; Season=1; Episode=2 },
            @{ Url='https://pluto.tv/br/shows/1550017/episode/626a9f2255812e0013e83f38/'; Season=1; Episode=5 },
            @{ Url='https://pluto.tv/br/shows/1550017/episode/626a9f2555812e0013e840d4/'; Season=1; Episode=7 }
          )
          foreach ($case in $cases) {
            $result = Get-VideoDlPlutoEpisodeNumbers $case.Url
            Write-Host "$($case.Url) -> S$($result.Season)E$($result.Episode) [$($result.Confidence)]"
            if ($result.Season -ne $case.Season -or $result.Episode -ne $case.Episode -or $result.Confidence -ne 'high') {
              throw "Unexpected Pluto metadata for $($case.Url)"
            }
          }

      - name: Validate integration
        shell: pwsh
        run: |
          $main = Get-Content src/video-dl.ps1 -Raw
          $pluto = Get-Content src/pluto-dl.ps1 -Raw
          $archive = Get-Content src/archive.ps1 -Raw
          if ($main -match 'Get-VideoDlEpisodeNumbersFromText \$html') { throw 'Main still parses full HTML with generic title patterns.' }
          if ($pluto -match 'Get-VideoDlEpisodeNumbersFromText \$html') { throw 'Pluto helper still parses full HTML with generic title patterns.' }
          if ($main -notmatch 'Get-VideoDlPlutoEpisodeNumbers') { throw 'Main Pluto metadata probe missing.' }
          if ($pluto -notmatch 'Get-VideoDlPlutoEpisodeNumbers') { throw 'Pluto helper metadata probe missing.' }
          if ($archive -notmatch 'Try-ReconcileVideoDlSeriesPath') { throw 'Archive reconciliation missing.' }
          if ((Get-Content VERSION -Raw).Trim() -ne '0.4.5') { throw 'VERSION is not 0.4.5.' }
