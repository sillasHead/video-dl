name: Apply v0.4.5 fix

on:
  push:
    branches:
      - fix/pluto-episode-api
    paths:
      - '.github/workflows/apply-v045-fix.yml'
      - 'src/episode-detection.ps1'
      - 'tests/episode-detection.ps1'
      - 'src/video-dl.ps1'
      - 'src/pluto-dl.ps1'
      - 'src/archive.ps1'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pluto-episode-api

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem src -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "Parser errors in $($_.Name):" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
            }
          }
          if ($failed) { exit 1 }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\episode-detection.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File src\video-dl.ps1 --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Locate current Pluto episode query
        shell: powershell
        run: |
          $pageUrl = 'https://pluto.tv/br/shows/1550017/episode/626a9f2655812e0013e8412f/'
          $headers = @{ 'User-Agent'='Mozilla/5.0' }
          $html = [string](Invoke-WebRequest -Uri $pageUrl -UseBasicParsing -TimeoutSec 20 -Headers $headers).Content
          $scripts = [regex]::Matches($html, '<script[^>]+src=["'']([^"'']+\.js(?:\?[^"'']*)?)["'']', 'IgnoreCase') | ForEach-Object { $_.Groups[1].Value } | Select-Object -Unique
          Write-Host "Scripts found: $(@($scripts).Count)"
          $needles = @('FullEpisodesData','tnPersistedDocumentHash','seasonNumber','episodeNumber')
          $checked = 0
          foreach ($src in @($scripts)) {
            if ($checked -ge 80) { break }
            $checked++
            try {
              $uri = if ($src -match '^https?://') { $src } else { [Uri]::new([Uri]'https://pluto.tv', $src).AbsoluteUri }
              $js = [string](Invoke-WebRequest -Uri $uri -UseBasicParsing -TimeoutSec 15 -Headers $headers).Content
              foreach ($needle in $needles) {
                $idx = $js.IndexOf($needle, [System.StringComparison]::OrdinalIgnoreCase)
                if ($idx -lt 0) { continue }
                $start = [Math]::Max(0, $idx - 1000)
                $len = [Math]::Min(3000, $js.Length - $start)
                Write-Host "MATCH [$needle] in $uri"
                Write-Host ($js.Substring($start, $len))
              }
            } catch { }
          }
          Write-Host "Scripts checked: $checked"

      - name: Validate integration
        shell: pwsh
        run: |
          $main = Get-Content src/video-dl.ps1 -Raw
          $pluto = Get-Content src/pluto-dl.ps1 -Raw
          $archive = Get-Content src/archive.ps1 -Raw
          if ($main -match 'Get-VideoDlEpisodeNumbersFromText \$html') { throw 'Main still parses full HTML with generic title patterns.' }
          if ($pluto -match 'Get-VideoDlEpisodeNumbersFromText \$html') { throw 'Pluto helper still parses full HTML with generic title patterns.' }
          if ($archive -notmatch 'Try-ReconcileVideoDlSeriesPath') { throw 'Archive reconciliation missing.' }
          if ((Get-Content VERSION -Raw).Trim() -ne '0.4.5') { throw 'VERSION is not 0.4.5.' }
