name: Apply v0.4.4

on:
  push:
    branches:
      - feat/episode-detection
    paths:
      - '.github/scripts/apply_v044.py'
      - '.github/workflows/apply-v044.yml'
      - 'src/episode-detection.ps1'
      - 'tests/episode-detection.ps1'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/episode-detection
      - name: Apply patch
        shell: pwsh
        run: python .github/scripts/apply_v044.py
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem src -Filter *.ps1 | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $failed = $true
              Write-Host "Parser errors in $($_.Name):" -ForegroundColor Red
              $errors | ForEach-Object { Write-Host $_.Message -ForegroundColor Red }
            }
          }
          if ($failed) { exit 1 }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\episode-detection.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File src\video-dl.ps1 --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate integration markers
        shell: pwsh
        run: |
          $main = Get-Content src/video-dl.ps1 -Raw
          $pluto = Get-Content src/pluto-dl.ps1 -Raw
          $setup = Get-Content setup.ps1 -Raw
          if ($main -notmatch 'episode-detection\.ps1') { throw 'Main helper import missing.' }
          if ($pluto -notmatch 'episode-detection\.ps1') { throw 'Pluto helper import missing.' }
          if ($setup -notmatch 'episode-detection\.ps1') { throw 'Installer helper missing.' }
          if ($main -notmatch 'Get-VideoDlEpisodeNumbersFromText') { throw 'Generic parser integration missing.' }
          if ($pluto -notmatch 'Get-VideoDlEpisodeNumbersFromText') { throw 'Pluto parser integration missing.' }
          if ((Get-Content VERSION -Raw).Trim() -ne '0.4.4') { throw 'VERSION is not 0.4.4.' }
      - name: Commit generated changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git restore .github/workflows/release.yml
          git add src tests README.md VERSION setup.ps1 install.ps1 installer/video-dl.iss
          if (-not (git status --porcelain)) { exit 0 }
          git commit -m "feat: melhora detecção de temporada e episódio"
          git push origin HEAD:feat/episode-detection
