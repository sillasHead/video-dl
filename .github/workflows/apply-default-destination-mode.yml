name: Apply default destination mode patch

on:
  push:
    branches: [feat/default-destination-mode]
    paths:
      - ".github/workflows/apply-default-destination-mode.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/default-destination-mode

      - name: Patch destination behavior
        shell: pwsh
        run: .github/scripts/apply-default-destination-mode.ps1

      - name: Validate patched script
        shell: powershell
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "src\video-dl.ps1"), [ref]$null, [ref]$errors)
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "src\video-dl.ps1" --version
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "src\video-dl.ps1" --help

      - name: Commit patch
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/video-dl.ps1
          git commit -m "feat: add reversible default destination mode"
          git push origin HEAD:feat/default-destination-mode
