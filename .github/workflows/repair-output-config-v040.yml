name: Repair output config v0.4.0

on:
  push:
    branches: [feat/output-config-v040]
    paths:
      - ".github/workflows/repair-output-config-v040.yml"
      - ".github/scripts/repair-output-config-v040.ps1"

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/output-config-v040

      - name: Repair generated script
        shell: pwsh
        run: .github/scripts/repair-output-config-v040.ps1

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem "src" -Filter "*.ps1" | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Host "$($_.Name): $($_.Message) (linha $($_.Extent.StartLineNumber))" -ForegroundColor Red }
            }
          }
          if ($failed) { throw "Falha na validação dos scripts PowerShell." }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "src\video-dl.ps1" --version
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "src\video-dl.ps1" --help *> $null

      - name: Commit repair
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/video-dl.ps1
          git commit -m "fix: repair v0.4.0 generated script"
          git push origin HEAD:feat/output-config-v040
