name: Repair v0.4.1

on:
  push:
    branches: [fix/v041-quality-duplicates]
    paths:
      - ".github/workflows/repair-v041.yml"
      - ".github/scripts/repair_v041.py"

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v041-quality-duplicates

      - name: Apply repair
        shell: pwsh
        run: python .github/scripts/repair_v041.py

      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem "src" -Filter "*.ps1" | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Host "$($_.Message) (linha $($_.Extent.StartLineNumber))" -ForegroundColor Red }
            }
          }
          if ($failed) { throw "Falha na validação dos scripts PowerShell." }
          $source = Get-Content "src\video-dl.ps1" -Raw
          if ($source -match '(?im)^\s*\$host\s*=') { throw 'Ainda existe atribuição à variável automática $Host.' }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "src\video-dl.ps1" --version
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "src\video-dl.ps1" --help *> $null

      - name: Commit repair
        if: always()
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/video-dl.ps1 src/pluto-dl.ps1 src/th-dl.ps1 README.md VERSION
          if (-not (git status --porcelain)) { exit 0 }
          git commit -m "fix: finish v0.4.1 quality and duplicate handling"
          git push origin HEAD:fix/v041-quality-duplicates
