name: Validate v0.4.5

on:
  push:
    branches: [fix/pluto-episode-api]
    paths:
      - '.github/workflows/validate-v045.yml'
      - 'src/**'
      - 'tests/**'
      - 'VERSION'

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse PowerShell
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem src -Filter *.ps1 | ForEach-Object {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { $failed = $true; $errors | ForEach-Object { Write-Host $_.Message } }
          }
          if ($failed) { exit 1 }
      - name: Episode and archive tests
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\episode-detection.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Live Pluto metadata
        shell: powershell
        run: |
          . .\src\episode-detection.ps1
          $cases = @(
            @{ Url='https://pluto.tv/br/shows/1550017/episode/626a9f2655812e0013e8412f/'; Season=1; Episode=2 },
            @{ Url='https://pluto.tv/br/shows/1550017/episode/626a9f2255812e0013e83f38/'; Season=1; Episode=5 },
            @{ Url='https://pluto.tv/br/shows/1550017/episode/626a9f2555812e0013e840d4/'; Season=1; Episode=7 }
          )
          foreach ($case in $cases) {
            $r = Get-VideoDlPlutoEpisodeNumbers $case.Url
            Write-Host "$($case.Url) -> S$($r.Season)E$($r.Episode) [$($r.Confidence)]"
            if ($r.Season -ne $case.Season -or $r.Episode -ne $case.Episode -or $r.Confidence -ne 'high') { throw 'Unexpected Pluto metadata.' }
          }
      - name: Smoke
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File src\video-dl.ps1 --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File src\video-dl.ps1 --help *> $null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
